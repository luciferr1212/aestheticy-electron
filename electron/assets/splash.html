<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; font-src 'self'" />
<title>Aestheticy</title>
<style>
  @font-face { font-family: 'Splash Display'; font-weight: 600; src: url('fonts/InterDisplay-SemiBold.woff') format('woff'); }
  @font-face { font-family: 'Splash Display'; font-weight: 500; src: url('fonts/InterDisplay-Medium.woff') format('woff'); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-app-region: drag; user-select: none; }
  .stage {
    position: absolute; inset: 0; border-radius: 22px; overflow: hidden; background: #05060c;
    transition: opacity .45s ease; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }
  body.out .stage { opacity: 0; }

  /* Space image: fades in smoothly, then drifts very slowly (transform only = cheap) */
  .bg {
    position: absolute; inset: -4%; background: url('splash.jpg') center / cover no-repeat;
    opacity: 0; transform: scale(1.1);
    animation: bgIn 1.6s ease-out .05s forwards, drift 9s ease-out .05s forwards;
  }
  @keyframes bgIn { to { opacity: 1; } }
  @keyframes drift { to { transform: scale(1.0); } }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(5,6,12,0) 35%, rgba(5,6,12,.55) 100%);
  }

  .content {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .title, .by { display: flex; font-family: 'Splash Display', 'Segoe UI', system-ui, sans-serif; }
  .title {
    font-weight: 600; font-size: 96px; line-height: 1.05; letter-spacing: -0.025em;
    filter: drop-shadow(0 0 22px rgba(150,170,255,.30)) drop-shadow(0 3px 2px rgba(0,0,0,.45));
  }
  .by {
    margin-top: 10px; font-weight: 500; font-size: 24px; letter-spacing: .34em; padding-left: .34em;
    filter: drop-shadow(0 0 12px rgba(150,170,255,.25)) drop-shadow(0 2px 1px rgba(0,0,0,.4));
  }

  /* Glass letters: translucent gradient fill + thin bright rim + a light sweep passing over each letter */
  .ch {
    display: inline-block; padding: 0 .05em .22em; margin: 0 -.05em -.22em; color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image:
      linear-gradient(105deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%),
      linear-gradient(180deg, rgba(255,255,255,.99) 0%, rgba(214,225,255,.78) 48%, rgba(255,255,255,.92) 100%);
    background-size: 280% 100%, 100% 100%;
    background-position: 160% 0, 0 0;
    -webkit-text-stroke: 1px rgba(255,255,255,.55);
    opacity: 0; transform: translateY(18px) scale(.94); filter: blur(14px);
    animation:
      chIn 1.0s cubic-bezier(.2,.75,.2,1) calc(1.15s + var(--i) * .075s) forwards,
      sheen 1.1s ease-in-out calc(2.5s + var(--i) * .09s) 1 forwards;
  }
  .ch-sm {
    -webkit-text-stroke: .6px rgba(255,255,255,.3);
    background-image:
      linear-gradient(105deg, transparent 38%, rgba(255,255,255,.9) 50%, transparent 62%),
      linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(190,205,255,.5) 55%, rgba(255,255,255,.7) 100%);
    animation:
      chIn .9s cubic-bezier(.2,.75,.2,1) calc(2.15s + var(--i) * .06s) forwards,
      sheen 1.0s ease-in-out calc(3.0s + var(--i) * .07s) 1 forwards;
  }
  @keyframes chIn { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes sheen {
    from { background-position: 160% 0, 0 0; }
    to   { background-position: -60% 0, 0 0; }
  }

  .line {
    width: 220px; height: 1px; margin-top: 18px; transform: scaleX(0); opacity: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    animation: lineIn 1.1s ease-out 1.9s forwards;
  }
  @keyframes lineIn { to { transform: scaleX(1); opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .bg { animation: bgIn .6s ease-out forwards; transform: none; }
    .ch { animation: chIn .4s ease-out forwards; filter: none; transform: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="vignette"></div>
    <div class="content">
      <div class="title" aria-label="Aestheticy"><span class="ch" style="--i:0">A</span><span class="ch" style="--i:1">e</span><span class="ch" style="--i:2">s</span><span class="ch" style="--i:3">t</span><span class="ch" style="--i:4">h</span><span class="ch" style="--i:5">e</span><span class="ch" style="--i:6">t</span><span class="ch" style="--i:7">i</span><span class="ch" style="--i:8">c</span><span class="ch" style="--i:9">y</span></div>
      <div class="line"></div>
      <div class="by" aria-label="by mido" style="margin-top:16px"><span class="ch ch-sm" style="--i:0">b</span><span class="ch ch-sm" style="--i:1">y</span><span class="ch ch-sm" style="--i:2">&nbsp;</span><span class="ch ch-sm" style="--i:3">m</span><span class="ch ch-sm" style="--i:4">i</span><span class="ch ch-sm" style="--i:5">d</span><span class="ch ch-sm" style="--i:6">o</span></div>
    </div>
  </div>
</body>
</html>
